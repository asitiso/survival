name: Phase 4533-4550 Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - work/phase4533-4550-elite-affix-cue-arbitration

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build focused target
        run: npm run build
      - name: Phase focused tests
        shell: bash
        run: |
          files=$(find tests -maxdepth 1 -type f \( -name 'phase4533-*.test.mjs' -o -name 'phase4539-*.test.mjs' -o -name 'phase4545-*.test.mjs' \) -print | sort)
          node --test $files
