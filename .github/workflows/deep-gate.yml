name: Deep Gate

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

concurrency:
  group: deep-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build once
        run: npm run build
      - name: Full regression on compiled output
        run: node --test tests/*.test.mjs
      - name: Raster gate on compiled output
        run: node scripts/render-raster-ci.mjs
      - name: Release gate on compiled output
        run: node scripts/render-release-gate.mjs
      - name: Candidate gate on compiled output
        run: node scripts/release-candidate-audit.mjs
