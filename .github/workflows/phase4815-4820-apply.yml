name: Phase 4815-4820 Apply

on:
  push:
    branches:
      - work/phase4815-4820-attack-resolution-handoff
    paths:
      - .github/workflows/phase4815-4820-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4815-4820-attack-resolution-handoff
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/game/game.ts')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "import { consumeCoreAttackAttribution, type CoreAttackAttribution } from './core-attack-outcome-attribution.js';",
                  "import { consumeCoreAttackAttribution, type CoreAttackAttribution } from './core-attack-outcome-attribution.js';\nimport { attackResolutionHandoffPresentation, createAttackResolutionHandoffState, recordAttackResolutionHandoff, type AttackResolutionHandoffState } from './attack-resolution-handoff.js';",
              ),
              (
                  "private damageReasonState: DamageReasonState | null = null;",
                  "private damageReasonState: DamageReasonState | null = null;\n  private attackResolutionHandoffState:AttackResolutionHandoffState=createAttackResolutionHandoffState();",
              ),
              (
                  "this.damageReasonState = null;",
                  "this.damageReasonState = null;\n    this.attackResolutionHandoffState=createAttackResolutionHandoffState();",
              ),
              (
                  "this.damageReasonState = recordDamageReason(this.damageReasonState, source, applied, this.hero.maxHp, this.elapsed);",
                  "const previousDamageReason=this.damageReasonState;\n          const nextDamageReason=recordDamageReason(previousDamageReason, source, applied, this.hero.maxHp, this.elapsed);\n          this.damageReasonState=nextDamageReason;\n          if(nextDamageReason!==previousDamageReason&&nextDamageReason.attackIntent)this.attackResolutionHandoffState=recordAttackResolutionHandoff(this.attackResolutionHandoffState,nextDamageReason.attackIntent,this.elapsed);",
              ),
              (
                  "if (applied > 0) { const coreAttackAttribution=consumeCoreAttackAttribution(source); this.frameEndlessEvents.push({ type: 'core_damaged', amount: applied }); this.queueSurvivalResponseVfx('coreHit',{mitigationRatio,damageSource:source,...(coreAttackAttribution?{coreAttackAttribution}:{}),...(origin?{pressureVector:{x:this.core.pos.x-origin.x,y:this.core.pos.y-origin.y}}:{})}); }",
                  "if (applied > 0) { const coreAttackAttribution=consumeCoreAttackAttribution(source); if(coreAttackAttribution?.attackIntent)this.attackResolutionHandoffState=recordAttackResolutionHandoff(this.attackResolutionHandoffState,coreAttackAttribution.attackIntent,this.elapsed); this.frameEndlessEvents.push({ type: 'core_damaged', amount: applied }); this.queueSurvivalResponseVfx('coreHit',{mitigationRatio,damageSource:source,...(coreAttackAttribution?{coreAttackAttribution}:{}),...(origin?{pressureVector:{x:this.core.pos.x-origin.x,y:this.core.pos.y-origin.y}}:{})}); }",
              ),
              (
                  "const enemy = this.enemies.enemies.find((candidate) => candidate.id === cue.enemyId);\n      if (!enemy) continue;\n      ctx.globalAlpha = cue.style === 'support-ring' ? 0.42 : 0.78;\n      ctx.strokeStyle = cue.color; ctx.lineWidth = cue.style === 'boss-ring' ? 5 : 3.5;",
                  "const enemy = this.enemies.enemies.find((candidate) => candidate.id === cue.enemyId);\n      if (!enemy) continue;\n      const handoff=cue.attackIntent?attackResolutionHandoffPresentation(this.attackResolutionHandoffState,cue.attackIntent.key,this.elapsed,this.presentationSettings.reducedMotion,this.presentationSettings.reducedFlash):{resolved:false,alphaScale:1,sizeScale:1};\n      ctx.globalAlpha = (cue.style === 'support-ring' ? 0.42 : 0.78)*handoff.alphaScale;\n      ctx.strokeStyle = cue.color; ctx.lineWidth = (cue.style === 'boss-ring' ? 5 : 3.5)*handoff.sizeScale;",
              ),
              (
                  "ctx.strokeStyle = pattern.color; ctx.globalAlpha = pattern.opacity;",
                  "ctx.strokeStyle = pattern.color; ctx.globalAlpha = pattern.opacity*handoff.alphaScale;",
              ),
              (
                  "ctx.lineWidth = Math.max(10, pattern.width * 0.12);",
                  "ctx.lineWidth = Math.max(7, pattern.width * 0.12*handoff.sizeScale);",
              ),
              (
                  "ctx.lineWidth = pattern.width;\n          ctx.beginPath(); ctx.arc(enemy.pos.x, enemy.pos.y, pattern.radius, 0, Math.PI * 2); ctx.stroke();",
                  "ctx.lineWidth = pattern.width*handoff.sizeScale;\n          ctx.beginPath(); ctx.arc(enemy.pos.x, enemy.pos.y, pattern.radius*handoff.sizeScale, 0, Math.PI * 2); ctx.stroke();",
              ),
              (
                  "ctx.beginPath(); ctx.arc(enemy.pos.x, enemy.pos.y, cue.radius, 0, Math.PI * 2); ctx.stroke();",
                  "ctx.beginPath(); ctx.arc(enemy.pos.x, enemy.pos.y, cue.radius*handoff.sizeScale, 0, Math.PI * 2); ctx.stroke();",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:100]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Build
        run: npm run build
      - name: Focused TDD
        run: node --test tests/phase4803-4808-attack-outcome-linkage.test.mjs tests/phase4809-4814-core-attack-attribution.test.mjs tests/phase4815-4820-attack-resolution-handoff.test.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit GREEN implementation and remove applicator
        shell: bash
        run: |
          rm .github/workflows/phase4815-4820-apply.yml
          git config user.name "asitiso"
          git config user.email "asitiso.woo@gmail.com"
          git add src/game/game.ts
          git add -u .github/workflows/phase4815-4820-apply.yml
          git commit -m "feat: hand off resolved attack telegraphs"
          git push origin HEAD:work/phase4815-4820-attack-resolution-handoff
