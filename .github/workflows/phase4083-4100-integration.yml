name: Phase 4083-4100 Integration Gate
on:
  push:
    branches: [work/phase4083-4088-fast]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  full-regression:
    name: Full regression shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    env:
      SHARDS: 8
      SHARD: ${{ matrix.shard }}
      ALS_TEST_WORKERS: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run complete regression shard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t all < <(find tests -maxdepth 1 -type f -name '*.test.mjs' | sort)
          selected=()
          for i in "${!all[@]}"; do
            if (( i % SHARDS == SHARD )); then selected+=("${all[$i]}"); fi
          done
          echo "TOTAL_TEST_FILES=${#all[@]} SHARD=$SHARD SELECTED=${#selected[@]}"
          test "${#selected[@]}" -gt 0
          node --test --test-concurrency=1 "${selected[@]}"
  release-gates:
    needs: full-regression
    runs-on: ubuntu-latest
    env:
      ALS_TEST_WORKERS: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify Phase 4083-4100 contracts
        run: |
          node --test \
            tests/phase4083-4088-threat-depth-occlusion-continuity.test.mjs \
            tests/phase4089-4094-threat-depth-recovery.test.mjs \
            tests/phase4095-4100-threat-depth-stack.test.mjs
          git diff --check
      - run: npm run verify:raster
      - run: npm run verify:release
      - run: npm run verify:candidate
  finalize-tested-tree:
    needs: release-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove integration-only workflow and commit tested tree
        run: |
          rm -f .github/workflows/phase4083-4100-integration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u .github/workflows/phase4083-4100-integration.yml
          git commit -m "Prepare Phase 4083-4100 verified integration tree"
          git push origin HEAD:work/phase4083-4088-fast
