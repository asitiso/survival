name: Phase 4533-4550 Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - work/phase4533-4550-elite-affix-cue-arbitration

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile focused test target
        run: npm run build
      - name: Phase 4533-4550 focused TDD bundles
        shell: bash
        run: |
          files=$(find tests -maxdepth 1 -type f \( -name 'phase4533-*.test.mjs' -o -name 'phase4539-*.test.mjs' -o -name 'phase4545-*.test.mjs' \) -print | sort)
          node --test $files
      - name: Related elite affix regression
        shell: bash
        run: |
          set +e
          report="$RUNNER_TEMP/phase4533-related-regression.txt"
          : > "$report"
          status=0
          files=$(find tests -maxdepth 1 -type f \( -name '*swift*.test.mjs' -o -name '*frenzied*.test.mjs' -o -name '*elite-affix*.test.mjs' \) -print | grep -vE 'phase4533-|phase4539-|phase4545-' | sort)
          for file in $files; do
            echo "=== $file ===" >> "$report"
            node --test "$file" >> "$report" 2>&1
            code=$?
            echo "EXIT=$code" >> "$report"
            echo >> "$report"
            if [ "$code" -ne 0 ]; then status=1; fi
          done
          cat "$report"
          exit "$status"
      - name: Upload related regression diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4533-related-regression
          path: ${{ runner.temp }}/phase4533-related-regression.txt
          retention-days: 1
      - name: Full regression
        run: npm test
      - name: Build
        run: npm run build
      - name: Raster gate
        run: npm run verify:raster
      - name: Release gate
        run: npm run verify:release
      - name: Candidate gate
        run: npm run verify:candidate
