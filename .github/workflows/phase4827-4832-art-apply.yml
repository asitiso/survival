name: Phase 4827-4832 Art Apply v3

on:
  push:
    branches:
      - work/phase4827-4832-battlefield-art-integration
    paths:
      - .github/workflows/phase4827-4832-art-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4827-4832-battlefield-art-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply battlefield art patch
        run: python scripts/phase4827-art-apply.py
      - name: Build
        run: npm run build
      - name: Phase 4827-4832 TDD
        run: node --test tests/phase4827-4832-battlefield-art-integration.test.mjs
      - name: Related battlefield regressions
        run: node --test tests/*battlefield*test.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit verified integration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/game.ts
          if git diff --cached --quiet; then
            echo "No game integration change needed"
            exit 0
          fi
          git commit -m "feat: integrate battlefield gameplay artwork"
          git push origin HEAD:work/phase4827-4832-battlefield-art-integration
