name: Phase 4191-4208 Integration Gate

on:
  push:
    branches:
      - work/phase4191-4208-threat-rhythm
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-regression-shard.mjs 0
  regression-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-regression-shard.mjs 1
  regression-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-regression-shard.mjs 2
  regression-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-regression-shard.mjs 3
  regression-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-regression-shard.mjs 4
  regression-5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-regression-shard.mjs 5
  regression-6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-regression-shard.mjs 6
  regression-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-regression-shard.mjs 7
  release-gates:
    runs-on: ubuntu-latest
    needs:
      - regression-0
      - regression-1
      - regression-2
      - regression-3
      - regression-4
      - regression-5
      - regression-6
      - regression-7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fresh phase contracts
        run: npm run build && node --test tests/phase4191-4196-threat-rhythm-peak-separation.test.mjs tests/phase4197-4202-threat-rhythm-recovery.test.mjs tests/phase4203-4208-threat-rhythm-temporal-arbitration.test.mjs
      - name: Diff check
        run: git diff --check
      - name: Raster gate
        run: npm run verify:raster
      - name: Release gate
        run: npm run verify:release
      - name: Candidate gate
        run: npm run verify:candidate
