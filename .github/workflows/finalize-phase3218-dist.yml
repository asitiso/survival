name: Finalize Phase 3218 dist

on:
  push:
    branches: [main]
    paths:
      - GITHUB-BASELINE.md

permissions:
  contents: write

jobs:
  finalize-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified dist from uploaded Phase 3218 archive
        shell: bash
        run: |
          set -euo pipefail
          upload_commit="68e2aecd366c4fac8bfc8bdafeab52b21e6d8bf9"
          archive="arcane-last-stand-phase3218-full-merged.zip"
          git show "${upload_commit}:${archive}" > /tmp/phase3218.zip
          unzip -q /tmp/phase3218.zip 'dist/*' -d /tmp/phase3218
          rm -rf dist
          cp -a /tmp/phase3218/dist ./dist
          test -d dist
          test "$(find dist -type f | wc -l)" -gt 700

      - name: Commit verified dist and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          rm -f .github/workflows/finalize-phase3218-dist.yml
          git add -A .github/workflows/finalize-phase3218-dist.yml
          git commit -m "Restore verified Phase 3218 dist runtime"
          git push origin HEAD:main
