name: Phase 4532 Regression Diagnose 2

on:
  push:
    paths:
      - '.sync/phase4496.ready'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4515-4532-swift-cadence-readability
      - name: Broaden Phase 4263 source-contract search
        shell: bash
        run: |
          set -euo pipefail
          echo '--- tests explicitIdx ---'
          grep -R -n "explicitIdx" tests || true
          echo '--- tests drawEnemyOpponentFrameBody ---'
          grep -R -n "drawEnemyOpponentFrameBody" tests || true
          echo '--- source drawEnemyOpponentFrameBody ---'
          grep -n -A45 -B10 "drawEnemyOpponentFrameBody" src/game/enemies.ts || true
          echo '--- source scalarOr pose ---'
          grep -n -A8 -B8 "scalarOr('pose'" src/game/enemies.ts || true
          echo '--- source explicitPose ---'
          grep -n -A8 -B8 "explicitPose" src/game/enemies.ts || true
