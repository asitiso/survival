name: Phase 4359 Apply Integration
on:
  push:
    branches:
      - work/phase4353-4370-cast-impact-readability
    paths:
      - .phase4359-apply
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4353-4370-cast-impact-readability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Phase 4359-4364 runtime integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'missing pattern in {path}: {old!r}')
              p.write_text(s.replace(old,new,1))

          replace_once('src/game/combat-feedback.ts',
              "import { directionalHitVfxProfile, directionalHitVector, hitApproachProfile, directionalImpactRecoilProfile } from './visual-presence.js';",
              "import { directionalHitVfxProfile, directionalHitVector, hitApproachProfile, directionalImpactRecoilProfile } from './visual-presence.js';\nimport { actionResultMinimumGap, type ActionResultKind } from './action-result-readability.js';")
          replace_once('src/game/combat-feedback.ts',
              "interface ImpactCue { kind: 'impact'; pos: Vec2; ttl: number; maxTtl: number; impactKind: ImpactKind; }",
              "interface ImpactCue { kind: 'impact'; pos: Vec2; ttl: number; maxTtl: number; impactKind: ImpactKind; }\ninterface ResultCue { kind:'result'; pos:Vec2; ttl:number; maxTtl:number; resultKind:ActionResultKind; source?:Vec2; }")
          replace_once('src/game/combat-feedback.ts',
              "  addImpact(pos: Vec2, kind: ImpactKind): void;",
              "  addImpact(pos: Vec2, kind: ImpactKind): void;\n  addActionResult?(pos:Vec2, kind:ActionResultKind, source?:Vec2):void;")
          replace_once('src/game/combat-feedback.ts',
              "  private directionalRecoilMaxTtl = 0;",
              "  private directionalRecoilMaxTtl = 0;\n  private resultCues:ResultCue[]=[];\n  private resultCooldowns=new Map<ActionResultKind,number>();")
          replace_once('src/game/combat-feedback.ts',
              "  get activeCount(): number { return this.cues.length; }",
              "  get activeCount(): number { return this.cues.length+this.resultCues.length; }")
          replace_once('src/game/combat-feedback.ts',
              "  reset(): void { this.cues = []; this.shake = 0; this.shakePhase = 0; this.impactVisualCooldown = 0; this.cameraPressureOffset=0; this.cameraPressureTtl=0; this.cameraPressureMaxTtl=0; this.directionalRecoil={x:0,y:0}; this.directionalRecoilTtl=0; this.directionalRecoilMaxTtl=0; }",
              "  reset(): void { this.cues = []; this.resultCues=[]; this.resultCooldowns.clear(); this.shake = 0; this.shakePhase = 0; this.impactVisualCooldown = 0; this.cameraPressureOffset=0; this.cameraPressureTtl=0; this.cameraPressureMaxTtl=0; this.directionalRecoil={x:0,y:0}; this.directionalRecoilTtl=0; this.directionalRecoilMaxTtl=0; }")
          replace_once('src/game/combat-feedback.ts',
              "  update(dt: number): void {",
              "  addActionResult(pos:Vec2,kind:ActionResultKind,source?:Vec2):void {\n    if((this.resultCooldowns.get(kind)??0)>0)return;\n    const ttl=kind==='normalHit'?0.16:kind==='weakpointHit'?0.20:0.28;\n    this.resultCues.push({kind:'result',pos:{...pos},resultKind:kind,ttl,maxTtl:ttl,...(source?{source:{...source}}:{})});\n    if(this.resultCues.length>18)this.resultCues.splice(0,this.resultCues.length-18);\n    this.resultCooldowns.set(kind,actionResultMinimumGap(kind));\n  }\n\n  update(dt: number): void {")
          replace_once('src/game/combat-feedback.ts',
              "    for (const cue of this.cues) {",
              "    for(const [kind,remaining] of this.resultCooldowns){const next=Math.max(0,remaining-dt);if(next<=0)this.resultCooldowns.delete(kind);else this.resultCooldowns.set(kind,next);}\n    for(const cue of this.resultCues)cue.ttl-=dt;\n    this.resultCues=this.resultCues.filter((cue)=>cue.ttl>0);\n    for (const cue of this.cues) {")

          replace_once('src/game/enemies.ts',"    let remaining = amount;","    let remaining = amount;\n    let guardBroken=false;")
          replace_once('src/game/enemies.ts',"      const guardBroken=guardBefore>0&&(enemy.guardHp ?? 0)<=0;","      guardBroken=guardBefore>0&&(enemy.guardHp ?? 0)<=0;")
          replace_once('src/game/enemies.ts',
              "    this.feedback?.addHit(enemy.pos, amount, impactTier, enemy.type, source);",
              "    this.feedback?.addHit(enemy.pos, amount, impactTier, enemy.type, source);\n    if(guardBroken)this.feedback?.addActionResult?.(enemy.pos,'guardBreak',source);")
          replace_once('src/game/enemies.ts',
              "    if (enemy.type === 'boss' && impactTier !== 'normal') this.feedback?.addImpact(enemy.pos, 'bossHit');",
              "    if (enemy.type === 'boss' && impactTier !== 'normal') { this.feedback?.addImpact(enemy.pos, 'bossHit'); this.feedback?.addActionResult?.(enemy.pos,'bossStagger',source); }")
          replace_once('src/game/enemies.ts',
              "    if (!killed) return false;",
              "    if (!killed) return false;\n    this.feedback?.addActionResult?.(enemy.pos,'enemyKill',source);")

          replace_once('src/game/spells.ts',
              "export class SpellSystem {",
              "export class SpellSystem {\n  private hitMagicTarget(world:SpellWorld,pos:Vec2,strength:number,source?:Vec2):void {\n    const result=world.magicTargets?.hitMagic(pos,strength);\n    if(!result?.hit)return;\n    world.feedback?.addActionResult?.(pos,result.destroyed?'weakpointBreak':'weakpointHit',source??world.hero.pos);\n  }")
          replacements={
              "world.magicTargets?.hitMagic(impactPos, tuning.damage * 0.72);":"this.hitMagicTarget(world,impactPos,tuning.damage * 0.72,hitSource);",
              "world.magicTargets?.hitMagic(world.hero.pos, tuning.damage);":"this.hitMagicTarget(world,world.hero.pos,tuning.damage,world.hero.pos);",
              "world.magicTargets?.hitMagic(pos, tuning.damage * 0.8);":"this.hitMagicTarget(world,pos,tuning.damage * 0.8,world.hero.pos);",
              "world.magicTargets?.hitMagic(p.pos, p.damage * Math.min(0.28, dt * 4));":"this.hitMagicTarget(world,p.pos,p.damage * Math.min(0.28,dt * 4),p.visualLaunchWorldOrigin??world.hero.pos);",
              "world.magicTargets?.hitMagic(field.pos, field.damage * 0.55);":"this.hitMagicTarget(world,field.pos,field.damage * 0.55,field.pos);",
              "world.magicTargets?.hitMagic(meteor.pos, meteor.damage * 0.8);":"this.hitMagicTarget(world,meteor.pos,meteor.damage * 0.8,world.hero.pos);",
              "world.magicTargets?.hitMagic(hole.pos, hole.damage * 0.55);":"this.hitMagicTarget(world,hole.pos,hole.damage * 0.55,hole.pos);",
          }
          p=Path('src/game/spells.ts'); s=p.read_text()
          for old,new in replacements.items():
              if old not in s: raise SystemExit(f'missing spells pattern: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Focused Phase 4353-4364 tests
        run: node --test tests/phase4353-4358-action-result-ownership.test.mjs tests/phase4359-4364-meaningful-impact-confirmation.test.mjs
      - run: git diff --check
      - name: Commit integration
        run: |
          git config user.name asitiso
          git config user.email asitiso.woo@gmail.com
          git add src/game/combat-feedback.ts src/game/enemies.ts src/game/spells.ts
          git add -f dist/game/action-result-readability.js dist/game/boss-encounters.js dist/game/combat-feedback.js dist/game/enemies.js dist/game/spells.js
          git commit -m "feat: confirm meaningful combat outcomes"
          git push origin HEAD:work/phase4353-4370-cast-impact-readability
