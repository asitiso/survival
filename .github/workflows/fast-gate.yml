name: Fast Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: fast-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build once
        run: npm run build
      - name: Changed phase TDD
        shell: bash
        run: |
          base="origin/${{ github.base_ref }}"
          files=$(git diff --name-only "$base"...HEAD -- 'tests/*.test.mjs' | sort)
          if [ -z "$files" ]; then
            echo 'No changed test files.'
            exit 0
          fi
          node --test $files
      - name: Related elite-affix regression
        shell: bash
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          if ! printf '%s\n' "$changed" | grep -Eq '^src/game/(elite-affix|enemies\.ts)'; then
            echo 'Elite-affix source unchanged; related regression skipped.'
            exit 0
          fi
          files=$(find tests -maxdepth 1 -type f \( -name '*swift*.test.mjs' -o -name '*frenzied*.test.mjs' -o -name '*elite-affix*.test.mjs' \) -print | sort)
          if [ -z "$files" ]; then
            echo 'No related elite-affix tests found.'
            exit 0
          fi
          node --test $files
