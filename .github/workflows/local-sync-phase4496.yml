name: Phase 4532 Regression Diagnose 3

on:
  push:
    paths:
      - '.sync/phase4496.ready'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4515-4532-swift-cadence-readability
      - name: Locate Phase 4263 files and contracts
        shell: bash
        run: |
          set -euo pipefail
          echo '--- filenames 4263 ---'
          find tests -maxdepth 1 -type f -iname '*4263*' -print | sort
          echo '--- any 4263 text ---'
          grep -R -n "4263" tests | head -80 || true
          echo '--- any poseIdx text ---'
          grep -R -n "poseIdx\|explicitIdx\|explicitPose\|scalarOr.*pose" tests src/game/enemies.ts | head -160 || true
          echo '--- test count ---'
          find tests -maxdepth 1 -name '*.test.mjs' -type f | wc -l
