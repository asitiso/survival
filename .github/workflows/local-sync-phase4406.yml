name: Local Sync Phase 4406
on:
  push:
    branches:
      - sync/phase4353-4370-local-final
    paths:
      - .sync/phase4406.trigger
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode verified local patch
        run: base64 -d .sync/phase4389-4406.patch.gz.b64 | gzip -d > /tmp/phase4389-4406.patch
      - name: Recreate verified local tree and push result
        run: |
          set -euo pipefail
          git config user.name asitiso
          git config user.email asitiso.woo@gmail.com
          git fetch origin work/phase4371-4388-damage-result-arbitration
          git switch -C work/phase4389-4406-damage-number-packing origin/work/phase4371-4388-damage-result-arbitration
          git apply --index /tmp/phase4389-4406.patch
          TREE=$(git write-tree)
          test "$TREE" = "010465307f1e590b315683e96ba1106d1177dc60"
          git diff --cached --check
          git commit -m "feat: pack Phase 4389-4406 damage number anchors"
          git push origin HEAD:work/phase4389-4406-damage-number-packing
