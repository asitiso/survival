name: Fast Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: fast-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build once
        run: npm run build
      - name: Diagnose focused + directly coupled regression
        id: diagnose
        shell: bash
        run: |
          base="origin/${{ github.base_ref }}"
          mapfile -t files < <(node scripts/fast-gate-select.mjs "$base")
          mkdir -p tmp
          report=tmp/phase4884-fast-gate-diagnostic.txt
          : > "$report"
          printf 'Selected tests (%s):\n' "${#files[@]}" | tee -a "$report"
          printf '  %s\n' "${files[@]}" | tee -a "$report"
          failures=0
          for file in "${files[@]}"; do
            printf '\n===== %s =====\n' "$file" | tee -a "$report"
            if node --test "$file" >> "$report" 2>&1; then
              printf 'RESULT: PASS %s\n' "$file" | tee -a "$report"
            else
              printf 'RESULT: FAIL %s\n' "$file" | tee -a "$report"
              failures=$((failures + 1))
            fi
          done
          printf '\nFAILURES=%s\n' "$failures" | tee -a "$report"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: phase4884-fast-gate-diagnostic
          path: tmp/phase4884-fast-gate-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve gate result
        if: steps.diagnose.outputs.failures != '0'
        run: exit 1
