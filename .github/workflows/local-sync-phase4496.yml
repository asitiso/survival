name: Phase 4545-4550 Dense Affix Arbitration GREEN

on:
  push:
    paths:
      - '.sync/phase4496.ready'

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/phase4353-4370-local-final
          path: sync
      - uses: actions/checkout@v4
        with:
          ref: work/phase4533-4550-elite-multiaffix-arbitration
          fetch-depth: 0
          path: target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: target/package-lock.json
      - name: Apply verified Train 3 patch
        working-directory: target
        run: python ../sync/.sync/apply-phase4533-4550.py
      - name: Install and build
        working-directory: target
        run: npm ci && npm run build
      - name: Phase 4533-4550 cumulative GREEN
        working-directory: target
        run: node --test tests/phase4533-4538-elite-affix-primary-ownership.test.mjs tests/phase4539-4544-elite-affix-owner-handoff.test.mjs tests/phase4545-4550-elite-affix-dense-arbitration.test.mjs
      - name: Commit verified Train 3
        working-directory: target
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/elite-affix-identity-assets.ts src/game/enemies.ts
          git add -f dist/game/elite-affix-identity-assets.js dist/game/enemies.js
          git commit -m 'feat: arbitrate dense elite multi-affix presentation'
          git push origin HEAD:work/phase4533-4550-elite-multiaffix-arbitration
