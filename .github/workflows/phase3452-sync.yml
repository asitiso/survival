name: Phase 3452 one-shot sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3452-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify Phase 3452 patch
        shell: bash
        run: |
          set -euo pipefail
          cat sync/phase3452/xz-* > /tmp/phase3452.patch.xz.b64
          base64 -d /tmp/phase3452.patch.xz.b64 > /tmp/phase3452.patch.xz
          xz -t /tmp/phase3452.patch.xz
          xz -dc /tmp/phase3452.patch.xz > /tmp/phase3452.patch
          echo '011b922bf8ab8f24403879f47bebd156b2d1ecf072052f668571ff89818ef3b8  /tmp/phase3452.patch' | sha256sum -c -
          git apply --check /tmp/phase3452.patch
          git apply /tmp/phase3452.patch

      - name: Commit exact Phase 3452 source sync
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sync/phase3452
          rm -f .github/workflows/phase3452-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync verified local Phase 3452 source'
          git push origin HEAD:main
