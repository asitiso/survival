name: Bootstrap Phase 3218 source

on:
  push:
    branches: [main]
    paths:
      - arcane-last-stand-phase3218-full-merged.zip

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout survival
        uses: actions/checkout@v4

      - name: Verify uploaded archive
        run: |
          test -f arcane-last-stand-phase3218-full-merged.zip
          unzip -t arcane-last-stand-phase3218-full-merged.zip >/dev/null

      - name: Import Phase 3218 tree
        run: |
          tmp="$(mktemp -d)"
          unzip -q arcane-last-stand-phase3218-full-merged.zip -d "$tmp"
          cp -a "$tmp"/. ./
          rm -rf "$tmp"
          rm -f arcane-last-stand-phase3218-full-merged.zip
          rm -f .github/workflows/bootstrap-phase3218.yml
          cat > GITHUB-BASELINE.md <<'EOF'
          # GitHub baseline

          Imported from the verified Phase 3218 full merged archive.

          - ChatGPT source main: `95dc175657b6ec815bc54fd0def61c03298a7d07`
          - Full regression: 825 files / 2,969 tests / 0 fail
          - Raster: 5/5 PASS
          - Release: `RQ-D4630257` PASS
          - Candidate: `RCQ-6006367D` PASS
          - Action invariant: 9/9
          EOF

      - name: Commit complete source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Arcane Last Stand Phase 3218 full source"
          git push origin main
