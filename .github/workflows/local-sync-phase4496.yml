name: Phase 4532 Swift Contract Diagnose

on:
  push:
    paths:
      - '.sync/phase4496.ready'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4515-4532-swift-cadence-readability
      - name: Inspect swift response callsites
        shell: bash
        run: |
          set -euo pipefail
          echo '--- queue definition ---'
          grep -n -A18 -B4 "queueEliteAffixResponseVfx" src/game/enemies.ts | head -180 || true
          echo '--- swift response occurrences ---'
          grep -n -A8 -B8 "'swift'" src/game/enemies.ts | head -220 || true
          echo '--- swift ownership occurrences ---'
          grep -n -A10 -B10 "swiftStrikeOwnershipPresentation" src/game/enemies.ts | head -220 || true
