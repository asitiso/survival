name: Phase 4869-4874 Applicator

on:
  push:
    branches:
      - work/phase4869-4874-terrain-foreground-registration
    paths:
      - .github/workflows/phase4869-4874-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded terrain foreground registration integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/game/game.ts')
          source = path.read_text()

          old_import = "import { terrainForegroundOcclusionPresentation } from './terrain-foreground-occlusion.js';"
          new_import = "import { terrainForegroundOcclusionPresentation, terrainForegroundSpriteRegistration } from './terrain-foreground-occlusion.js';"
          if old_import in source:
              source = source.replace(old_import, new_import, 1)
          elif new_import not in source:
              raise SystemExit('terrain foreground import marker not found')

          old_foreground = """      const foreground = terrainForegroundOcclusionPresentation({
        wallWidth: wall.w,
        wallHeight: wall.h,
        battlefieldStress,
        reducedFlash: this.presentationSettings.reducedFlash,
      });
      let criticalThreatOcclusion = criticalThreatOcclusionArbitrationPresentation({ threatClass: 'none', overlap: 0 });
"""
          new_foreground = """      const foreground = terrainForegroundOcclusionPresentation({
        wallWidth: wall.w,
        wallHeight: wall.h,
        battlefieldStress,
        reducedFlash: this.presentationSettings.reducedFlash,
      });
      const registration = terrainForegroundSpriteRegistration({
        wallX: wall.x,
        wallY: wall.y,
        wallWidth: wall.w,
        wallHeight: wall.h,
        spriteCropRatio: foreground.spriteCropRatio,
      });
      let criticalThreatOcclusion = criticalThreatOcclusionArbitrationPresentation({ threatClass: 'none', overlap: 0 });
"""
          if old_foreground in source:
              source = source.replace(old_foreground, new_foreground, 1)
          elif new_foreground not in source:
              raise SystemExit('foreground registration insertion marker not found')

          old_overlap = """          wallX: wall.x - 4,
          wallY: wall.y - 3,
          wallWidth: wall.w + 8,
          capHeight: foreground.capHeight + 4,
"""
          new_overlap = """          wallX: registration.capDrawX,
          wallY: registration.capDrawY,
          wallWidth: registration.capDrawWidth,
          capHeight: registration.capDrawHeight,
"""
          if old_overlap in source:
              source = source.replace(old_overlap, new_overlap, 1)
          elif new_overlap not in source:
              raise SystemExit('critical overlap registration marker not found')

          old_destination = """      const destinationHeight = foreground.capHeight + 4;
      const destinationX = wall.x - 4;
      const destinationY = wall.y - 3;
      const destinationWidth = wall.w + 8;
"""
          if old_destination in source:
              source = source.replace(old_destination, '', 1)

          replacements = {
              "          destinationX,\n          destinationY,\n          destinationWidth,\n          destinationHeight,": "          registration.capDrawX,\n          registration.capDrawY,\n          registration.capDrawWidth,\n          registration.capDrawHeight,",
              "        ctx.fillRect(wall.x, wall.y, wall.w, foreground.capHeight);": "        ctx.fillRect(registration.capDrawX, registration.capDrawY, registration.capDrawWidth, registration.capDrawHeight);",
              "      ctx.moveTo(wall.x + 2, wall.y + 1);\n      ctx.lineTo(wall.x + Math.max(2, wall.w - 2), wall.y + 1);": "      ctx.moveTo(registration.capDrawX + 2, registration.capDrawY + 1);\n      ctx.lineTo(registration.capDrawX + Math.max(2, registration.capDrawWidth - 2), registration.capDrawY + 1);",
          }
          for old, new in replacements.items():
              if old in source:
                  source = source.replace(old, new, 1)
              elif new not in source:
                  raise SystemExit(f'registration draw marker not found: {old[:40]}')

          old_overlay = """    for (const wall of this.terrain.walls) {
      const drawWidth = Math.max(wall.w + 18, 72);
      const drawHeight = Math.max(wall.h + 18, 72);
      const dx = wall.x + wall.w / 2 - drawWidth / 2;
      const dy = wall.y + wall.h / 2 - drawHeight / 2;
"""
          new_overlay = """    for (const wall of this.terrain.walls) {
      const registration = terrainForegroundSpriteRegistration({
        wallX: wall.x,
        wallY: wall.y,
        wallWidth: wall.w,
        wallHeight: wall.h,
        spriteCropRatio: 0,
      });
      const { drawX: dx, drawY: dy, drawWidth, drawHeight } = registration;
"""
          if old_overlay in source:
              source = source.replace(old_overlay, new_overlay, 1)
          elif new_overlay not in source:
              raise SystemExit('terrain overlay registration marker not found')

          path.write_text(source)
          PY
      - name: Build and focused verification
        run: |
          npm ci
          npm run build
          node --test tests/phase4869-4874-terrain-foreground-registration.test.mjs
          git diff --check
      - name: Commit bounded integration and remove applicator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase4869-4874-apply.yml
          git add src/game/game.ts src/game/terrain-foreground-occlusion.ts tests/phase4869-4874-terrain-foreground-registration.test.mjs
          if git diff --cached --quiet; then
            echo "No bounded integration changes to commit."
            exit 0
          fi
          git commit -m "feat: register terrain foreground cap to obstacle sprite geometry"
          git push origin HEAD:work/phase4869-4874-terrain-foreground-registration
