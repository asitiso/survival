name: Phase 4839-4844 Sprite Action Apply

on:
  push:
    branches:
      - work/phase4839-4844-enemy-sprite-action-readability
    paths:
      - .github/workflows/phase4839-4844-sprite-action-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4839-4844-enemy-sprite-action-readability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply sprite action renderer patch
        run: python scripts/phase4839-sprite-action-apply.py
      - name: Build
        run: npm run build
      - name: Phase 4839-4844 TDD
        run: node --test tests/phase4839-4844-enemy-sprite-action-readability.test.mjs
      - name: Related enemy motion and sprite regressions
        shell: bash
        run: |
          files="$(grep -lE 'enemyMotionRenderPresentation|enemyAttackMotionPresentation|enemyHitStaggerPresentation|enemySpritePresentation|bossSpritePresentation' tests/*.test.mjs || true)"
          if [[ -n "$files" ]]; then
            node --test $files
          fi
      - name: Diff check
        run: git diff --check
      - name: Commit verified renderer integration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/enemies.ts
          if git diff --cached --quiet; then
            echo "No renderer integration change needed"
            exit 0
          fi
          git commit -m "feat: apply enemy sprite action readability"
          git push origin HEAD:work/phase4839-4844-enemy-sprite-action-readability
