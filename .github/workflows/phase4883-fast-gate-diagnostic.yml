name: Phase 4883 Fast Gate Diagnostic

on:
  push:
    branches:
      - work/phase4883-persistent-spell-grounding
    paths:
      - .github/workflows/phase4883-fast-gate-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4883-persistent-spell-grounding
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run selected tests one by one
        shell: bash
        run: |
          git fetch origin work/phase4882-enemy-combat-overlay-grounding
          mapfile -t files < <(node scripts/fast-gate-select.mjs origin/work/phase4882-enemy-combat-overlay-grounding)
          mkdir -p tmp
          : > tmp/phase4883-fast-gate-diagnostic.txt
          printf 'selected=%s\n' "${#files[@]}" >> tmp/phase4883-fast-gate-diagnostic.txt
          failed=0
          for file in "${files[@]}"; do
            printf 'TEST %s\n' "$file" >> tmp/phase4883-fast-gate-diagnostic.txt
            if node --test "$file" > /tmp/phase4883-one.log 2>&1; then
              printf 'PASS %s\n' "$file" >> tmp/phase4883-fast-gate-diagnostic.txt
            else
              failed=$((failed+1))
              printf 'FAIL %s\n' "$file" >> tmp/phase4883-fast-gate-diagnostic.txt
              sed -n '1,120p' /tmp/phase4883-one.log >> tmp/phase4883-fast-gate-diagnostic.txt
            fi
          done
          printf 'failed=%s\n' "$failed" >> tmp/phase4883-fast-gate-diagnostic.txt
      - name: Publish bounded diagnostic and remove workflow
        run: |
          rm .github/workflows/phase4883-fast-gate-diagnostic.yml
          git add tmp/phase4883-fast-gate-diagnostic.txt .github/workflows/phase4883-fast-gate-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: record Phase 4883 Fast Gate diagnostic'
          git push origin HEAD:work/phase4883-persistent-spell-grounding
