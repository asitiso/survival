name: Phase 4046 source sync

on:
  push:
    branches:
      - sync/phase4046

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin sync/phase4046
          mkdir -p /tmp/phase4046
          for i in 00 01 02 03 04; do
            git show "origin/sync/phase4046:sync/phase4046/chunk-$i" > "/tmp/phase4046/chunk-$i"
          done
          cat /tmp/phase4046/chunk-* > /tmp/phase4046.patch.xz
          echo "e14da6d4b463f6e2144e80280db11982c0cf9ee2a42bc8f24459de6e33fcdae4  /tmp/phase4046.patch.xz" | sha256sum -c -
          xz -t /tmp/phase4046.patch.xz
          xz -dc /tmp/phase4046.patch.xz > /tmp/phase4046.patch
          echo "5a098a136012eebc4e49a71ce98618a27878193197b922ce81409335a62c4f7b  /tmp/phase4046.patch" | sha256sum -c -
          git apply --check /tmp/phase4046.patch

      - name: Apply and push
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/phase4046.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync verified local Phase 4046 source"
          git push origin HEAD:main

      - name: Clean temporary branch
        if: success()
        shell: bash
        run: |
          git push origin --delete sync/phase4046 || true
