name: Phase 4046 final source sync
on:
  push:
    branches: [sync/phase4046-upload]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact local patch
        shell: bash
        run: |
          set -euo pipefail
          cat sync/phase4046-v2/part-00.b64 sync/phase4046-v2/part-01.b64 sync/phase4046-v2/part-02.b64 sync/phase4046-v2/part-12a.b64 sync/phase4046-v2/part-12b.b64 sync/phase4046-v2/part-04.b64 sync/phase4046-v2/part-05.b64 sync/phase4046-v2/part-11.b64 sync/phase4046-v2/part-09.b64 sync/phase4046-v2/part-10.b64 sync/phase4046-v2/part-07.b64 sync/phase4046-v2/part-08.b64 > /tmp/p.b64
          test "$(wc -c < /tmp/p.b64)" -eq 164012
          base64 -d /tmp/p.b64 > /tmp/p.xz
          echo 'e14da6d4b463f6e2144e80280db11982c0cf9ee2a42bc8f24459de6e33fcdae4  /tmp/p.xz' | sha256sum -c -
          xz -t /tmp/p.xz
          xz -dc /tmp/p.xz > /tmp/p.patch
          echo '5a098a136012eebc4e49a71ce98618a27878193197b922ce81409335a62c4f7b  /tmp/p.patch' | sha256sum -c -
      - name: Apply and push main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          git apply --check /tmp/p.patch
          git apply /tmp/p.patch
          git diff --check
          git add -A
          git commit -m 'Sync verified local Phase 4046 source'
          git push origin main
# exact payload length 164012
