name: Phase 4857-4862 Applicator

on:
  push:
    branches:
      - work/phase4857-4862-terrain-foreground-occlusion
    paths:
      - .github/workflows/phase4857-4862-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded terrain foreground occlusion integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/game/game.ts')
          source = path.read_text()

          import_marker = "import { BATTLEFIELD_OBSTACLE_STATE_VFX_ATLAS, battlefieldObstacleStateForEvolution, battlefieldObstacleStateVfxSprite } from './battlefield-obstacle-state-vfx-assets.js';"
          import_line = "import { terrainForegroundOcclusionPresentation } from './terrain-foreground-occlusion.js';"
          if import_line not in source:
              if import_marker not in source:
                  raise SystemExit('terrain foreground import marker not found')
              source = source.replace(import_marker, import_marker + "\n" + import_line, 1)

          order_old = "    this.drawEnemyDefeatBodyTransitions(ctx);\n    this.drawElitePackApproachFormationVfx(ctx);"
          order_new = "    this.drawEnemyDefeatBodyTransitions(ctx);\n    this.drawTerrainForegroundOcclusion(ctx);\n    this.drawElitePackApproachFormationVfx(ctx);"
          if "this.drawTerrainForegroundOcclusion(ctx);" not in source:
              if order_old not in source:
                  raise SystemExit('foreground occlusion render-order marker not found')
              source = source.replace(order_old, order_new, 1)

          method_marker = "  private drawTerrainSpriteOverlays(ctx: CanvasRenderingContext2D, motion: ResidualCombatMotionPolicy): void {"
          method = r'''  private drawTerrainForegroundOcclusion(ctx: CanvasRenderingContext2D): void {
    const liveActorCount = this.enemies.enemies.reduce((count, enemy) => count + (enemy.alive ? 1 : 0), 0);
    const battlefieldStress = Math.max(
      Math.min(1, this.bossArena.hazards.length / 6),
      Math.min(1, Math.max(0, liveActorCount - 8) / 22),
    );
    const mapId = this.terrain.currentLayout.id;
    const obstacleState = battlefieldObstacleStateForEvolution(this.terrain.evolutionStage);
    const obstacleSprite = battlefieldObstacleStateVfxSprite(mapId, obstacleState);
    const wallSprite = battlefieldPropSprite(mapId, 'wall');

    for (const wall of this.terrain.walls) {
      const foreground = terrainForegroundOcclusionPresentation({
        wallWidth: wall.w,
        wallHeight: wall.h,
        battlefieldStress,
        reducedFlash: this.presentationSettings.reducedFlash,
      });
      const destinationHeight = foreground.capHeight + 4;
      const destinationX = wall.x - 4;
      const destinationY = wall.y - 3;
      const destinationWidth = wall.w + 8;
      const atlasImage = this.battlefieldObstacleStateVfxAtlasReady && this.battlefieldObstacleStateVfxAtlasImage
        ? this.battlefieldObstacleStateVfxAtlasImage
        : this.battlefieldPropVfxAtlasReady && this.battlefieldPropVfxAtlasImage
          ? this.battlefieldPropVfxAtlasImage
          : null;
      const sprite = atlasImage === this.battlefieldObstacleStateVfxAtlasImage ? obstacleSprite : wallSprite;

      ctx.save();
      if (atlasImage) {
        const sourceHeight = Math.max(1, Math.round(sprite.sh * foreground.spriteCropRatio));
        ctx.globalAlpha = foreground.capAlpha;
        ctx.drawImage(
          atlasImage,
          sprite.sx,
          sprite.sy,
          sprite.sw,
          sourceHeight,
          destinationX,
          destinationY,
          destinationWidth,
          destinationHeight,
        );
      } else {
        ctx.globalAlpha = foreground.capAlpha * 0.48;
        ctx.fillStyle = this.terrain.currentLayout.palette.border;
        ctx.fillRect(wall.x, wall.y, wall.w, foreground.capHeight);
      }
      ctx.globalAlpha = foreground.edgeAlpha;
      ctx.strokeStyle = '#f4fbff';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(wall.x + 2, wall.y + 1);
      ctx.lineTo(wall.x + Math.max(2, wall.w - 2), wall.y + 1);
      ctx.stroke();
      ctx.restore();
    }
  }

'''
          if "private drawTerrainForegroundOcclusion(" not in source:
              if method_marker not in source:
                  raise SystemExit('terrain sprite overlay method marker not found')
              source = source.replace(method_marker, method + method_marker, 1)

          path.write_text(source)
          PY
      - name: Build and focused verification
        run: |
          npm ci
          npm run build
          node --test tests/phase4857-4862-terrain-foreground-occlusion.test.mjs
          git diff --check
      - name: Commit bounded integration and remove applicator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase4857-4862-apply.yml
          git add src/game/game.ts src/game/terrain-foreground-occlusion.ts tests/phase4857-4862-terrain-foreground-occlusion.test.mjs
          if git diff --cached --quiet; then
            echo "No bounded integration changes to commit."
            exit 0
          fi
          git commit -m "feat: integrate terrain foreground occlusion"
          git push origin HEAD:work/phase4857-4862-terrain-foreground-occlusion
