name: Phase 4095-4100 Fast Train
on:
  push:
    branches: [work/phase4083-4088-fast]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply depth stack integration
        run: python3 scripts/apply-phase4095-4100-depth-stack.py
      - run: npm run build
      - name: Run Phase 4065-4100 affected regression
        run: |
          node --test \
            tests/phase4065-4070-battlefield-threat-priority.test.mjs \
            tests/phase4071-4076-battlefield-spatial-priority.test.mjs \
            tests/phase4077-4082-battlefield-temporal-focus.test.mjs \
            tests/phase4083-4088-threat-depth-occlusion-continuity.test.mjs \
            tests/phase4089-4094-threat-depth-recovery.test.mjs \
            tests/phase4095-4100-threat-depth-stack.test.mjs
      - run: git diff --check
      - name: Commit verified Fast Train 3
        run: |
          rm -f .github/workflows/phase4095-red.yml scripts/apply-phase4095-4100-depth-stack.py
          git config user.name asitiso
          git config user.email asitiso.woo@gmail.com
          git add src/game/enemies.ts src/game/spells.ts src/game/game.ts src/game/threat-impact-depth-stack-rendering.ts tests/phase4095-4100-threat-depth-stack.test.mjs
          git add -f dist/game/enemies.js dist/game/spells.js dist/game/game.js dist/game/threat-impact-depth-stack-rendering.js
          git add -u .github/workflows/phase4095-red.yml scripts/apply-phase4095-4100-depth-stack.py
          git commit -m "Phase 4095-4100 fast train threat depth stack"
          git push origin HEAD:work/phase4083-4088-fast
