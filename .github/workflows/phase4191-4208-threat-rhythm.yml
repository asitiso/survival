name: Phase 4191-4208 Threat Rhythm

on:
  push:
    branches:
      - work/phase4191-4208-threat-rhythm
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Targeted phase contracts
        shell: bash
        run: |
          set -euo pipefail
          files=()
          for f in \
            tests/phase4191-4196-threat-rhythm-peak-separation.test.mjs \
            tests/phase4197-4202-threat-rhythm-recovery.test.mjs \
            tests/phase4203-4208-threat-rhythm-temporal-arbitration.test.mjs; do
            [[ -f "$f" ]] && files+=("$f")
          done
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No threat-rhythm phase tests committed yet; bootstrap only."
            exit 0
          fi
          node --test "${files[@]}"
