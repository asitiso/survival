name: Phase 4101 Fast Train Staging Fix
on:
  push:
    branches: [work/phase4101-4118-fast]
    paths: ['.github/workflows/phase4101-fast-staging-fix.yml']
permissions:
  contents: write
jobs:
  fix-staging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch staging only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/phase4101-4118-fast-trains.yml')
          t=p.read_text()
          replacements={
            'git add src/game dist/game tests/phase4101-4106-spatial-threat-separation.test.mjs':'git add src/game tests/phase4101-4106-spatial-threat-separation.test.mjs\n          git add -f dist/game',
            'git add src/game dist/game tests/phase4107-4112-spatial-threat-recovery.test.mjs':'git add src/game tests/phase4107-4112-spatial-threat-recovery.test.mjs\n          git add -f dist/game',
            'git add src/game dist/game tests/phase4113-4118-dense-battlefield-arbitration.test.mjs':'git add src/game tests/phase4113-4118-dense-battlefield-arbitration.test.mjs\n          git add -f dist/game',
          }
          for old,new in replacements.items():
              if old not in t: raise SystemExit(f'missing staging command: {old}')
              t=t.replace(old,new,1)
          p.write_text(t)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/phase4101-4118-fast-trains.yml
          git commit -m "ci: stage tracked dist outputs explicitly"
          git push origin HEAD:work/phase4101-4118-fast
