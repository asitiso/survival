name: Phase 4046 source sync
on:
  push:
    branches: [sync/phase4046-upload]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            sync/phase4046-v2/part-00.b64 \
            sync/phase4046-v2/part-01.b64 \
            sync/phase4046-v2/part-02.b64 \
            sync/phase4046-v2/part-03.b64 \
            sync/phase4046-v2/part-04.b64 \
            sync/phase4046-v2/part-05.b64 \
            sync/phase4046-v2/part-11.b64 \
            sync/phase4046-v2/part-09.b64 \
            sync/phase4046-v2/part-10.b64 \
            sync/phase4046-v2/part-07.b64 \
            sync/phase4046-v2/part-08.b64 > /tmp/phase4046.b64
          test "$(wc -c < /tmp/phase4046.b64)" -eq 163264
          base64 -d /tmp/phase4046.b64 > /tmp/phase4046.patch.xz
          echo 'e14da6d4b463f6e2144e80280db11982c0cf9ee2a42bc8f24459de6e33fcdae4  /tmp/phase4046.patch.xz' | sha256sum -c -
          xz -t /tmp/phase4046.patch.xz
          xz -dc /tmp/phase4046.patch.xz > /tmp/phase4046.patch
          echo '5a098a136012eebc4e49a71ce98618a27878193197b922ce81409335a62c4f7b  /tmp/phase4046.patch' | sha256sum -c -
      - name: Apply to main and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          git apply --check /tmp/phase4046.patch
          git apply /tmp/phase4046.patch
          git diff --check
          git add -A
          git commit -m 'Sync verified local Phase 4046 source'
          git push origin main
      - name: Cleanup staging branch
        if: success()
        shell: bash
        run: git push origin --delete sync/phase4046-upload || true
# all chunks staged; verification rerun
