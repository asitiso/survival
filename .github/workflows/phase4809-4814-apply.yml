name: Phase 4809-4814 Apply

on:
  push:
    branches:
      - work/phase4809-4814-core-attack-attribution
    paths:
      - .github/workflows/phase4809-4814-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4809-4814-core-attack-attribution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          module_lines = [
              "import { consumeRenderedAttackOutcome, type AttackOutcomeMetadata, type AttackOutcomeSource } from './attack-outcome-linkage.js';",
              "",
              "export interface CoreAttackAttribution {",
              "  attackIntent: AttackOutcomeMetadata;",
              "  label: string;",
              "}",
              "",
              "function coreAttackerLabel(intent: AttackOutcomeMetadata): string | null {",
              "  if (intent.enemyType === 'boss') return '보스 → 핵';",
              "  if (intent.enemyType === 'bomber') return '폭탄병 → 핵';",
              "  return null;",
              "}",
              "",
              "export function consumeCoreAttackAttribution(source: AttackOutcomeSource): CoreAttackAttribution | null {",
              "  const attackIntent = consumeRenderedAttackOutcome('core', source);",
              "  if (!attackIntent) return null;",
              "  const label = coreAttackerLabel(attackIntent);",
              "  return label ? { attackIntent, label } : null;",
              "}",
          ]
          Path('src/game/core-attack-outcome-attribution.ts').write_text('\n'.join(module_lines) + '\n', encoding='utf-8')

          path = Path('src/game/game.ts')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "import { advanceDamageReason, recordDamageReason, type DamageReasonState } from './damage-reason-feedback.js';",
                  "import { advanceDamageReason, recordDamageReason, type DamageReasonState } from './damage-reason-feedback.js';\nimport { consumeCoreAttackAttribution, type CoreAttackAttribution } from './core-attack-outcome-attribution.js';",
              ),
              (
                  "private survivalResponseVfx: Array<{kind:SurvivalResponseVfxKind;x:number;y:number;ttl:number;maxTtl:number;worldGuardOwned?:boolean;mitigationRatio?:number;worldDamageOwned?:boolean;damageSource?:string;mixedPressure?:boolean;pressureVector?:Vec2}> = [];",
                  "private survivalResponseVfx: Array<{kind:SurvivalResponseVfxKind;x:number;y:number;ttl:number;maxTtl:number;worldGuardOwned?:boolean;mitigationRatio?:number;worldDamageOwned?:boolean;damageSource?:string;mixedPressure?:boolean;pressureVector?:Vec2;attackerLabel?:string}> = [];",
              ),
              (
                  "if (applied > 0) { this.frameEndlessEvents.push({ type: 'core_damaged', amount: applied }); this.queueSurvivalResponseVfx('coreHit',{mitigationRatio,damageSource:source,...(origin?{pressureVector:{x:this.core.pos.x-origin.x,y:this.core.pos.y-origin.y}}:{})}); }",
                  "if (applied > 0) { const coreAttackAttribution=consumeCoreAttackAttribution(source); this.frameEndlessEvents.push({ type: 'core_damaged', amount: applied }); this.queueSurvivalResponseVfx('coreHit',{mitigationRatio,damageSource:source,...(coreAttackAttribution?{coreAttackAttribution}:{}),...(origin?{pressureVector:{x:this.core.pos.x-origin.x,y:this.core.pos.y-origin.y}}:{})}); }",
              ),
              (
                  "private queueSurvivalResponseVfx(kind:SurvivalResponseVfxKind,metadata?:{mitigationRatio?:number;damageSource?:string;pressureVector?:Vec2}):void{",
                  "private queueSurvivalResponseVfx(kind:SurvivalResponseVfxKind,metadata?:{mitigationRatio?:number;damageSource?:string;pressureVector?:Vec2;coreAttackAttribution?:CoreAttackAttribution}):void{",
              ),
              (
                  "this.survivalResponseVfx.push({kind,x:target.x,y:target.y,ttl:maxTtl,maxTtl,...(metadata?.mitigationRatio!==undefined?{mitigationRatio:metadata.mitigationRatio}:{}),...(damageSource?{damageSource}:{}),...(mixedPressure?{mixedPressure:true}:{}),...(pressureVector?{pressureVector:{...pressureVector}}:{})});",
                  "const attackerLabel=kind==='coreHit'?metadata?.coreAttackAttribution?.label:undefined;\n    this.survivalResponseVfx.push({kind,x:target.x,y:target.y,ttl:maxTtl,maxTtl,...(metadata?.mitigationRatio!==undefined?{mitigationRatio:metadata.mitigationRatio}:{}),...(damageSource?{damageSource}:{}),...(mixedPressure?{mixedPressure:true}:{}),...(pressureVector?{pressureVector:{...pressureVector}}:{}),...(attackerLabel?{attackerLabel}:{})});",
              ),
              (
                  "ctx.drawImage(this.survivalResponseVfxAtlasImage,sprite.sx,sprite.sy,sprite.sw,sprite.sh,cue.x-drawW/2,cue.y-drawH/2,drawW,drawH);ctx.restore();",
                  "ctx.drawImage(this.survivalResponseVfxAtlasImage,sprite.sx,sprite.sy,sprite.sw,sprite.sh,cue.x-drawW/2,cue.y-drawH/2,drawW,drawH);ctx.restore();\n      if(cue.kind==='coreHit'&&cue.attackerLabel&&arbitrationAlphaScale>0){ctx.save();ctx.globalAlpha=Math.min(this.presentationSettings.reducedFlash?.38:.66,t*.72)*arbitrationAlphaScale;ctx.fillStyle='#d9f8ff';ctx.font='800 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.72)';ctx.shadowBlur=this.presentationSettings.reducedFlash?2:5;ctx.fillText(cue.attackerLabel,cue.x,cue.y-54*arbitrationSizeScale);ctx.restore();}",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:90]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Build
        run: npm run build
      - name: Focused TDD
        run: node --test tests/phase4803-4808-attack-outcome-linkage.test.mjs tests/phase4809-4814-core-attack-attribution.test.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit GREEN implementation and remove applicator
        shell: bash
        run: |
          rm .github/workflows/phase4809-4814-apply.yml
          git config user.name "asitiso"
          git config user.email "asitiso.woo@gmail.com"
          git add src/game/core-attack-outcome-attribution.ts src/game/game.ts tests/phase4809-4814-core-attack-attribution.test.mjs
          git add dist/game/core-attack-outcome-attribution.js dist/game/core-attack-outcome-attribution.d.ts dist/game/game.js dist/game/game.d.ts 2>/dev/null || true
          git add -u .github/workflows/phase4809-4814-apply.yml
          git commit -m "feat: attribute telegraphed attacks to guardian core hits"
          git push origin HEAD:work/phase4809-4814-core-attack-attribution
