name: Phase 4869-4874 Source Crop Fix

on:
  push:
    branches:
      - work/phase4869-4874-terrain-foreground-registration
    paths:
      - .github/workflows/phase4869-4874-source-crop-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply continuous source crop registration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/game/game.ts')
          source = path.read_text()
          old = "        const sourceHeight = Math.max(1, Math.round(sprite.sh * foreground.spriteCropRatio));"
          new = "        const sourceHeight = Math.max(1, sprite.sh * foreground.spriteCropRatio);"
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('source crop marker not found')
          path.write_text(source)
          PY
      - name: Build and focused verification
        run: |
          npm ci
          npm run build
          node --test tests/phase4869-4874-terrain-foreground-registration.test.mjs
          git diff --check
      - name: Commit one-line crop fix and remove applicator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase4869-4874-source-crop-fix.yml
          git add src/game/game.ts tests/phase4869-4874-terrain-foreground-registration.test.mjs
          git commit -m "fix: align terrain foreground source crop ratio"
          git push origin HEAD:work/phase4869-4874-terrain-foreground-registration
