name: Phase 4532 Regression Diagnose

on:
  push:
    paths:
      - '.sync/phase4496.ready'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4515-4532-swift-cadence-readability
      - name: Locate Phase 4263 contract and current helper source
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n -F "phase 4263-frame opponent body helper preserves explicit pose override ordering" tests || true
          grep -R -n -F "explicitIdx > poseIdx" tests || true
          grep -n -A28 -B8 -F "private drawEnemyOpponentFrameBody(" src/game/enemies.ts || true
          grep -n -F "const pose=visual ? visual.scalarOr('pose',0) :0;" src/game/enemies.ts || true
          grep -n -F "typeof explicitPose==='number'" src/game/enemies.ts || true
