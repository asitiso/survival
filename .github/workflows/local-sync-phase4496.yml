name: Phase 4515-4532 Final Verification

on:
  push:
    paths:
      - '.sync/phase4496.ready'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4515-4532-swift-cadence-readability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full regression
        run: npm test
      - name: Fresh build
        run: npm run build
      - name: Raster verification
        run: npm run verify:raster
      - name: Release verification
        run: npm run verify:release
      - name: Candidate verification
        run: npm run verify:candidate
      - name: Final tree checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
