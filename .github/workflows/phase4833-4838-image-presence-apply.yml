name: Phase 4833-4838 Image Presence Apply

on:
  push:
    branches:
      - work/phase4833-4838-enemy-image-presence
    paths:
      - .github/workflows/phase4833-4838-image-presence-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4833-4838-enemy-image-presence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply enemy image-presence renderer patch
        run: python scripts/phase4833-image-presence-apply.py
      - name: Build
        run: npm run build
      - name: Phase 4833-4838 TDD
        run: node --test tests/phase4833-4838-enemy-image-presence.test.mjs
      - name: Related enemy and boss sprite regressions
        shell: bash
        run: |
          files="$(grep -lE 'enemySpritePresentation|bossSpritePresentation|ENEMY_SPRITE_ATLAS|BOSS_SPRITE_ATLAS' tests/*.test.mjs || true)"
          if [[ -n "$files" ]]; then
            node --test $files
          fi
      - name: Diff check
        run: git diff --check
      - name: Commit verified renderer integration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/enemies.ts
          if git diff --cached --quiet; then
            echo "No renderer integration change needed"
            exit 0
          fi
          git commit -m "feat: strengthen enemy battlefield image presence"
          git push origin HEAD:work/phase4833-4838-enemy-image-presence
