name: Phase 4533-4550 Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - work/phase4533-4550-elite-affix-cue-arbitration

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build focused target
        run: npm run build
      - name: Phase focused tests
        run: node --test tests/phase4533-*.test.mjs tests/phase4539-*.test.mjs tests/phase4545-*.test.mjs
      - name: Full regression
        run: npm test
      - name: Build
        run: npm run build
      - name: Raster gate
        run: npm run verify:raster
      - name: Release gate
        run: npm run verify:release
      - name: Candidate gate
        run: npm run verify:candidate
