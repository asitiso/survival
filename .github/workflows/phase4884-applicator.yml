name: Phase 4884 Applicator

on:
  push:
    branches:
      - work/phase4884-pickup-layer-continuity
    paths:
      - .github/workflows/phase4884-applicator.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4884-pickup-layer-continuity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded Phase 4884 patch
        run: python scripts/phase4884-apply.py
      - name: Build
        run: npm run build
      - name: Focused pickup-layer regression
        run: >-
          node --test
          tests/phase4875-4880-enemy-actor-depth-ordering.test.mjs
          tests/phase4881-enemy-lifecycle-depth-continuity.test.mjs
          tests/phase4882-enemy-combat-overlay-grounding.test.mjs
          tests/phase4883-persistent-spell-grounding.test.mjs
          tests/phase4884-pickup-layer-continuity.test.mjs
      - name: Diff guard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf 'Changed working-tree files:\n'
          printf '  %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              src/game/game.ts|src/game/pickups.ts|src/game/pickup-layer-ordering.ts) ;;
              *) echo "Unexpected generated/modified file: $path"; exit 1 ;;
            esac
          done
          test "${#changed[@]}" -eq 3
      - name: Commit final production patch and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/game.ts src/game/pickups.ts src/game/pickup-layer-ordering.ts
          git rm .github/workflows/phase4884-applicator.yml scripts/phase4884-apply.py
          git commit -m 'feat: complete phase 4884 pickup layer continuity'
          git push origin HEAD:work/phase4884-pickup-layer-continuity
