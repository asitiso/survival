name: Phase 4533-4550 Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - work/phase4533-4550-elite-affix-cue-arbitration

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded EnemyManager integration
        run: node scripts/apply-phase4533-4550-integration.mjs
      - name: Build focused target
        run: npm run build
      - name: Phase focused tests
        shell: bash
        run: |
          files=$(find tests -maxdepth 1 -type f \( -name 'phase4533-*.test.mjs' -o -name 'phase4539-*.test.mjs' -o -name 'phase4545-*.test.mjs' \) -print | sort)
          node --test $files
      - name: Commit generated integration
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/enemies.ts dist/game/enemies.js dist/game/elite-affix-cue-arbitration.js
          if ! git diff --cached --quiet; then
            git commit -m 'feat: integrate elite multi-affix cue arbitration'
            git push origin HEAD:work/phase4533-4550-elite-affix-cue-arbitration
          fi
