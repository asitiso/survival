name: Phase 4101-4118 Clean Fast Continuation
on:
  push:
    branches: [work/phase4101-4118-fast]
    paths: ['.github/workflows/phase4101-4118-fast-continuation-v2.yml']
permissions:
  contents: write
jobs:
  clean-trains:
    runs-on: ubuntu-24.04
    env:
      ALS_TEST_WORKERS: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run clean TDD train sequence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/phase4101-4118-fast-trains.yml').read_text().splitlines()
          names=[
            'Train 1 RED Phase 4101-4106','Train 1 GREEN implementation',
            'Train 2 RED Phase 4107-4112','Train 2 GREEN implementation',
            'Train 3 RED Phase 4113-4118','Train 3 GREEN implementation',
          ]
          def extract(name):
              marker='      - name: '+name
              i=source.index(marker)
              if source[i+1].strip()!='run: |':raise SystemExit('missing run block '+name)
              out=[]
              for line in source[i+2:]:
                  if line.startswith('      - name: ') or line.startswith('      - uses: '):break
                  if line.startswith('          '):out.append(line[10:])
                  elif line.strip()=='':out.append('')
                  else:raise SystemExit(f'unexpected indentation in {name}: {line!r}')
              script='\n'.join(out)+'\n'
              stage={
                'git add src/game dist/game tests/phase4101-4106-spatial-threat-separation.test.mjs':'git add src/game tests/phase4101-4106-spatial-threat-separation.test.mjs\ngit add -f dist/game/enemies.js dist/game/game.js dist/game/spells.js dist/game/threat-impact-spatial-separation-rendering.js',
                'git add src/game dist/game tests/phase4107-4112-spatial-threat-recovery.test.mjs':'git add src/game tests/phase4107-4112-spatial-threat-recovery.test.mjs\ngit add -f dist/game/enemies.js dist/game/game.js dist/game/spells.js dist/game/threat-impact-spatial-recovery-rendering.js',
                'git add src/game dist/game tests/phase4113-4118-dense-battlefield-arbitration.test.mjs':'git add src/game tests/phase4113-4118-dense-battlefield-arbitration.test.mjs\ngit add -f dist/game/enemies.js dist/game/game.js dist/game/spells.js dist/game/threat-impact-dense-arbitration-rendering.js',
              }
              for old,new in stage.items():script=script.replace(old,new)
              script=script.replace('safeLaneSpatialReclaim.safeLaneAlphaScale; ','safeLaneSpatialReclaim.safeLaneAlphaScale;')
              return script
          d=Path('/tmp/phase-trains-clean');d.mkdir(exist_ok=True)
          for idx,name in enumerate(names,1):
              p=d/f'{idx:02d}.sh';p.write_text('set -euo pipefail\n'+extract(name));p.chmod(0o755);print(p,name)
          PY
          for f in /tmp/phase-trains-clean/*.sh; do echo "=== RUN $f ==="; bash "$f"; done
