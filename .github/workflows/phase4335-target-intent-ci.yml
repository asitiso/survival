name: Phase 4335 Target Intent CI
on:
  push:
    branches:
      - work/phase4335-4352-target-intent-readability
  workflow_dispatch:
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/phase4335-4340-target-intent-ownership.test.mjs
