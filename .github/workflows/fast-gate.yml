name: Fast Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: fast-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build once
        run: npm run build
      - name: Focused + directly coupled regression
        shell: bash
        run: |
          base="origin/${{ github.base_ref }}"
          mapfile -t files < <(node scripts/fast-gate-select.mjs "$base")
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No focused or directly coupled tests selected.'
            exit 0
          fi
          printf 'Selected tests (%s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          node --test "${files[@]}"
