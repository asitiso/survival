name: Phase 4527 Swift Dense GREEN

on:
  push:
    paths:
      - '.sync/phase4496.ready'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare feature branch and patch helper
        shell: bash
        run: |
          set -euo pipefail
          cp .sync/phase4527-green.py /tmp/phase4527-green.py
          git fetch origin work/phase4515-4532-swift-cadence-readability
          git switch -C work/phase4515-4532-swift-cadence-readability origin/work/phase4515-4532-swift-cadence-readability
          python /tmp/phase4527-green.py .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Focused Swift regression
        run: node --test tests/phase4515-4520-swift-cadence-lifecycle.test.mjs tests/phase4521-4526-swift-strike-ownership.test.mjs tests/phase4527-4532-swift-dense-arbitration.test.mjs
      - run: git diff --check
      - name: Commit and push verified result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name asitiso
          git config user.email asitiso.woo@gmail.com
          git add src/game/enemies.ts src/game/elite-affix-identity-assets.ts
          git add -f dist/game/enemies.js dist/game/elite-affix-identity-assets.js
          git diff --cached --check
          git commit -m "feat: arbitrate Phase 4527-4532 swift cadence density"
          git push origin HEAD:work/phase4515-4532-swift-cadence-readability
