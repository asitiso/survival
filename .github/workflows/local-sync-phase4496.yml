name: Phase 4532 Swift Contract Repair

on:
  push:
    paths:
      - '.sync/phase4496.ready'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4515-4532-swift-cadence-readability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore legacy swift queue ownership contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('src/game/enemies.ts')
          text=path.read_text()
          old="if (enemy.eliteAffixes?.includes('swift')) { enemy.swiftCadencePresentation=advanceSwiftCadenceLifecycle(enemy.swiftCadencePresentation,{inAttackRange:true,attackTimer:enemy.attackTimer,attackInterval:enemy.attackInterval,struck:true,dt:0}); this.queueEliteAffixResponseVfx(enemy,'swift',targetObj.pos); }"
          new="if (enemy.eliteAffixes?.includes('swift')) { enemy.swiftCadencePresentation=advanceSwiftCadenceLifecycle(enemy.swiftCadencePresentation,{inAttackRange:true,attackTimer:enemy.attackTimer,attackInterval:enemy.attackInterval,struck:true,dt:0}); this.queueEliteAffixResponseVfx(enemy,'swift'); const swiftResponseCue=this.eliteAffixResponseVfx.find((cue)=>cue.enemyId===enemy.id&&cue.affixId==='swift'&&cue.ttl>0.12); if(swiftResponseCue){swiftResponseCue.targetPos={...targetObj.pos};swiftResponseCue.targetKind=enemy.target;} }"
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one swift strike callsite, found {count}')
          path.write_text(text.replace(old,new,1))
          PY
          grep -n -F "queueEliteAffixResponseVfx(enemy,'swift')" src/game/enemies.ts
          grep -n -F "swiftResponseCue.targetPos={...targetObj.pos}" src/game/enemies.ts
      - name: Build
        run: npm run build
      - name: Targeted regression
        shell: bash
        run: |
          set -euo pipefail
          phase_tests=$(find tests -maxdepth 1 -type f \( -name 'phase4515-*' -o -name 'phase4521-*' -o -name 'phase4527-*' \) -print | sort | tr '\n' ' ')
          node --test tests/phase2469-2474-elite-affix-lifecycle-vfx.test.mjs $phase_tests
      - name: Source diff check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- src/game/enemies.ts
          git diff -- src/game/enemies.ts
      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name asitiso
          git config user.email asitiso.woo@gmail.com
          git add src/game/enemies.ts
          git commit -m "fix: preserve swift response queue contract"
          git push origin HEAD:work/phase4515-4532-swift-cadence-readability
          git rev-parse HEAD
