name: Phase 4515 Swift Cadence TDD

on:
  push:
    paths:
      - '.sync/phase4496.ready'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4515-4532-swift-cadence-readability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Phase 4515-4520 focused RED test
        run: node --test tests/phase4515-4520-swift-cadence-lifecycle.test.mjs
      - run: git diff --check
