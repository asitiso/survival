name: Phase 4539-4544 Owner Handoff RED

on:
  push:
    paths:
      - '.sync/phase4496.ready'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4533-4550-elite-multiaffix-arbitration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Phase 4539-4544 RED
        run: node --test tests/phase4539-4544-elite-affix-owner-handoff.test.mjs
