name: Phase 4335 Target Intent CI
on:
  push:
    branches:
      - work/phase4335-4352-target-intent-readability
  workflow_dispatch:
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:raster
      - run: npm run verify:release
      - run: npm run verify:candidate
      - run: git diff --check
