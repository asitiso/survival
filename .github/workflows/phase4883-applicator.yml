name: Phase 4883 Applicator

on:
  push:
    branches:
      - work/phase4883-persistent-spell-grounding
    paths:
      - .github/workflows/phase4883-applicator.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4883-persistent-spell-grounding
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded Phase 4883 patch
        run: python scripts/phase4883-apply.py
      - name: Build
        run: npm run build
      - name: Focused persistent-ground regression
        run: node --test tests/phase4875-4880-enemy-actor-depth-ordering.test.mjs tests/phase4881-enemy-lifecycle-depth-continuity.test.mjs tests/phase4882-enemy-combat-overlay-grounding.test.mjs tests/phase4883-persistent-spell-grounding.test.mjs
      - name: Normalize generated tracked output
        shell: bash
        run: |
          set -euo pipefail
          rm -f .git/index.lock
          while IFS= read -r path; do
            case "$path" in
              src/game/game.ts|src/game/spells.ts|src/game/persistent-spell-ground-ordering.ts) ;;
              *) git checkout -- "$path" ;;
            esac
          done < <(git diff --name-only)
      - name: Diff guard
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' src/game/game.ts src/game/persistent-spell-ground-ordering.ts src/game/spells.ts | sort)"
          printf 'changed:\n%s\n' "$actual"
          test "$actual" = "$expected"
      - name: Commit final production patch and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          rm -f .git/index.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/game.ts src/game/spells.ts src/game/persistent-spell-ground-ordering.ts
          git rm .github/workflows/phase4883-applicator.yml scripts/phase4883-apply.py
          git commit -m "feat: ground persistent spell lifecycle visuals"
          git push origin HEAD:work/phase4883-persistent-spell-grounding
