name: Phase 4521 Swift Strike TDD

on:
  push:
    paths:
      - '.sync/phase4496.ready'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4515-4532-swift-cadence-readability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Phase 4521-4526 focused RED test
        run: node --test tests/phase4521-4526-swift-strike-ownership.test.mjs
      - run: git diff --check
