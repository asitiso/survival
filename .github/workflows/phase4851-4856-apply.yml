name: Phase 4851-4856 Applicator

on:
  push:
    branches:
      - work/phase4851-4856-actor-grounding-depth-separation
    paths:
      - .github/workflows/phase4851-4856-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded actor grounding integration
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/game/enemies.ts')
          source = path.read_text()

          import_anchor = "import { characterGroundContactPresentation, characterHitRecoilPresentation } from './character-contact-recoil-rendering.js';\n"
          import_line = "import { actorGroundingDepthPresentation } from './actor-grounding-depth-separation.js';\n"
          assert import_anchor in source
          source = source.replace(import_anchor, import_anchor + import_line, 1)

          stress_anchor = "    const eliteAffixBattlefieldStress=Math.max(Math.max(0,Math.min(1,hazardPressure)),Math.min(1,Math.max(0,activeAffixElites.length-3)/5));\n"
          stress_insert = "    const liveActorCount=this.enemies.reduce((count,enemy)=>count+(enemy.alive?1:0),0);\n    const actorGroundingBattlefieldStress=Math.max(Math.max(0,Math.min(1,hazardPressure)),Math.min(1,Math.max(0,liveActorCount-8)/22));\n"
          assert stress_anchor in source
          source = source.replace(stress_anchor, stress_anchor + stress_insert, 1)

          presentation_anchor = "      const bossPresentation = bossArchetype ? bossSpritePresentation(bossArchetype, enemy.radius, bossSpriteAtlasReady) : null;\n"
          presentation_insert = "      const actorGroundingClass = enemy.type === 'boss' ? 'boss' : enemy.type === 'elite' || Boolean(enemy.eliteAffixes?.length) ? 'elite' : enemy.type === 'brute' || enemy.type === 'shieldbearer' || enemy.type === 'siegeGolem' ? 'heavy' : enemy.type === 'hound' || enemy.type === 'assassin' || enemy.type === 'golden' ? 'agile' : 'regular';\n      const actorGrounding = actorGroundingDepthPresentation({ actorClass: actorGroundingClass, battlefieldStress: actorGroundingBattlefieldStress, reducedMotion, reducedFlash });\n"
          assert presentation_anchor in source
          source = source.replace(presentation_anchor, presentation_anchor + presentation_insert, 1)

          width_old = "      const ownedShadowWidth=(shadowBaseWidth+(motionPresentation.shadowWidth-shadowBaseWidth)*shadowMotionScale)*spawnGroundMaterialize.shadowWidthScale*imagePresenceShadowScale;\n"
          width_new = "      const ownedShadowWidth=(shadowBaseWidth+(motionPresentation.shadowWidth-shadowBaseWidth)*shadowMotionScale)*spawnGroundMaterialize.shadowWidthScale*imagePresenceShadowScale*actorGrounding.shadowWidthScale;\n"
          assert width_old in source
          source = source.replace(width_old, width_new, 1)

          height_old = "      const ownedShadowHeight=(shadowBaseHeight+(motionPresentation.shadowHeight-shadowBaseHeight)*shadowMotionScale)*imagePresenceShadowScale;\n"
          height_new = "      const ownedShadowHeight=(shadowBaseHeight+(motionPresentation.shadowHeight-shadowBaseHeight)*shadowMotionScale)*imagePresenceShadowScale*actorGrounding.shadowHeightScale;\n"
          assert height_old in source
          source = source.replace(height_old, height_new, 1)

          alpha_old = "      ctx.fillStyle = `rgba(8,12,18,${Math.min(0.46, (groundContact.alpha + locomotionShadowBoost + recoveryShadowBoost + imagePresenceShadowAlphaBoost)*bossSpecialOriginHandoff.shadowAlphaScale*spawnGroundMaterialize.shadowAlphaScale)})`;\n"
          alpha_new = "      ctx.fillStyle = `rgba(8,12,18,${Math.min(0.46, (groundContact.alpha + locomotionShadowBoost + recoveryShadowBoost + imagePresenceShadowAlphaBoost)*bossSpecialOriginHandoff.shadowAlphaScale*spawnGroundMaterialize.shadowAlphaScale*actorGrounding.shadowAlphaScale)})`;\n"
          assert alpha_old in source
          source = source.replace(alpha_old, alpha_new, 1)

          boss_pulse_old = "        const bossContactAlpha=bossLocomotion.contactAlpha*bossContactPulseScale;\n"
          boss_pulse_new = "        const bossContactAlpha=bossLocomotion.contactAlpha*bossContactPulseScale*actorGrounding.contactPulseScale;\n"
          assert boss_pulse_old in source
          source = source.replace(boss_pulse_old, boss_pulse_new, 1)

          specialist_pulse_old = "        const specialistPulseAlpha=specialistLocomotionSignature.groundPulseAlpha*specialistGroundPulseScale;\n"
          specialist_pulse_new = "        const specialistPulseAlpha=specialistLocomotionSignature.groundPulseAlpha*specialistGroundPulseScale*actorGrounding.contactPulseScale;\n"
          assert specialist_pulse_old in source
          source = source.replace(specialist_pulse_old, specialist_pulse_new, 1)

          path.write_text(source)
          PY
      - name: Build and focused verification
        run: |
          npm ci
          npm run build
          node --test tests/phase4851-4856-actor-grounding-depth-separation.test.mjs
      - name: Commit bounded integration and remove applicator
        shell: bash
        run: |
          rm .github/workflows/phase4851-4856-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/enemies.ts .github/workflows/phase4851-4856-apply.yml
          git commit -m "feat: integrate actor grounding depth separation"
          git push
