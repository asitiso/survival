name: Phase 4532 Generated Tree Diagnose

on:
  push:
    paths:
      - '.sync/phase4496.ready'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4515-4532-swift-cadence-readability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reproduce candidate-generated tree
        run: npm run verify:candidate
      - name: Print generated changes
        shell: bash
        run: |
          set -euo pipefail
          echo '--- STATUS ---'
          git status --porcelain
          echo '--- DIFF NAMES ---'
          git diff --name-only
          echo '--- UNTRACKED ---'
          git ls-files --others --exclude-standard
          echo '--- DIFF CHECK ---'
          git diff --check
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
