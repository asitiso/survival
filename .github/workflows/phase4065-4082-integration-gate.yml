name: Phase 4065-4082 Integration Gate

on:
  push:
    branches:
      - work/phase4065-4070-fast
    paths:
      - '.github/workflows/phase4065-4082-integration-gate.yml'

permissions:
  contents: write

jobs:
  full-regression:
    name: Full regression shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run complete regression shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
          ALS_TEST_WORKERS: 8
        run: |
          set -euo pipefail
          mapfile -t all < <(find tests -maxdepth 1 -type f -name '*.test.mjs' | sort)
          selected=()
          for i in "${!all[@]}"; do
            if (( i % SHARDS == SHARD )); then selected+=("${all[$i]}"); fi
          done
          echo "TOTAL_TEST_FILES=${#all[@]} SHARD=$SHARD SELECTED=${#selected[@]}"
          test "${#selected[@]}" -gt 0
          node --test --test-concurrency=1 "${selected[@]}"

  release-gates:
    runs-on: ubuntu-latest
    needs: full-regression
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify new phase contracts
        run: |
          node --test \
            tests/phase4065-4070-battlefield-threat-priority.test.mjs \
            tests/phase4071-4076-battlefield-spatial-priority.test.mjs \
            tests/phase4077-4082-battlefield-temporal-focus.test.mjs
          git diff --check
      - run: npm run verify:raster
      - run: npm run verify:release
      - run: npm run verify:candidate

  finalize-tested-tree:
    runs-on: ubuntu-latest
    needs: release-gates
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove train-only workflows and commit tested source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase4065-4070-fast.yml
          rm -f .github/workflows/phase4065-4082-integration-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare Phase 4065-4082 verified integration tree"
          git push origin HEAD:work/phase4065-4070-fast
