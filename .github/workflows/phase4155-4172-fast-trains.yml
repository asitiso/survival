name: Phase 4155-4172 Fast Trains
on:
  push:
    branches: [work/phase4155-4172-fast]
    paths: ['.github/workflows/phase4155-4172-fast-trains.yml']
permissions:
  contents: write
jobs:
  fast-trains:
    runs-on: ubuntu-24.04
    env:
      ALS_TEST_WORKERS: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run Phase 4155-4172 fast trains v3
        run: python3 .github/phase4155-4172-fast-v3.py
