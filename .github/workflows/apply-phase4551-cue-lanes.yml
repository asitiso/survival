name: Apply Phase 4551 Cue Lanes

on:
  push:
    branches:
      - work/phase4551-4568-elite-cue-lanes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4551-4568-elite-cue-lanes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patch
        run: node scripts/apply-phase4551-cue-lanes.mjs
      - name: Commit source integration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/enemies.ts
          if git diff --cached --quiet; then
            echo 'No integration changes required.'
            exit 0
          fi
          git commit -m 'feat: integrate elite cue stable presentation lanes'
          git push origin HEAD:work/phase4551-4568-elite-cue-lanes
