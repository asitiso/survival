name: Phase 3219-3236 fast verification
on:
  push:
    branches:
      - work/phase3219-3236-fast
  workflow_dispatch:
permissions:
  contents: write
jobs:
  phase-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript runner
        run: npm install --no-save typescript@5.6.3
      - name: Build
        run: npm run build
      - name: Phase 3219-3236 tests
        run: node --test tests/phase3219-3224-core-guard-core-hit-arbitration.test.mjs tests/phase3225-3230-secondary-impact-anchor-lineage.test.mjs tests/phase3231-3236-safe-lane-transition-forecast-agreement.test.mjs
