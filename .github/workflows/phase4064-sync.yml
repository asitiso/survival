name: Phase 4064 Verified Sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/phase4064-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Phase 4046 source baseline and apply Phase 4047-4064 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/game/game.ts)" = "54daee9c18883aa60d1f6a03fa2fdf493144e2e6"
          test "$(git hash-object src/game/enemies.ts)" = "38d4917dfd24350601525357fe3be02407e2e68d"
          test "$(git hash-object src/game/spells.ts)" = "c67f48555db5fb1ad3d0a27e8c3493abed741e71"
          test "$(git hash-object dist/game/game.js)" = "eb975a63114a70b38720bfe331f130aa5b7aed0a"
          test "$(git hash-object dist/game/enemies.js)" = "cedfe9478696bc66c2ed1e1200fda07a1d92cec5"
          test "$(git hash-object dist/game/spells.js)" = "0683ed2567f52dd29fd0e949772c5d7c39dd578e"
          base64 -d sync/phase4064/patch.xz.b64 > /tmp/phase4064.patch.xz
          xz -t /tmp/phase4064.patch.xz
          xz -dc /tmp/phase4064.patch.xz > /tmp/phase4064.patch
          echo "68809cd359608653330cc7c7cd5e86745f72a87bc3e245a3b934015ab8be2118  /tmp/phase4064.patch" | sha256sum -c -
          git apply --check /tmp/phase4064.patch
          git apply /tmp/phase4064.patch
          git diff --check

      - name: Install and verify integrated source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
          node --test \
            tests/phase4047-4052-threat-impact-continuity.test.mjs \
            tests/phase4053-4058-threat-impact-recovery.test.mjs \
            tests/phase4059-4064-threat-impact-resolution.test.mjs
          npm run verify:raster
          npm run verify:release
          npm run verify:candidate
          git diff --check

      - name: Commit verified Phase 4047-4064 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sync/phase4064
          rm -f .github/workflows/phase4064-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate Phase 4047-4064 threat impact continuity"
          git push origin HEAD:main
