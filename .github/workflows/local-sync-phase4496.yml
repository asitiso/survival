name: Phase 4532 Exact Regression Capture

on:
  push:
    paths:
      - '.sync/phase4496.ready'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4515-4532-swift-cadence-readability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run full suite and print only exact failure blocks
        shell: bash
        run: |
          set +e
          npm test > /tmp/full-test.log 2>&1
          status=$?
          echo "TEST_EXIT=$status"
          echo '--- FAILURES ---'
          awk '/^not ok /{show=1;count=0} show{print;count++} show&&count>=55{show=0}' /tmp/full-test.log
          echo '--- SUMMARY ---'
          tail -30 /tmp/full-test.log
          exit 0
