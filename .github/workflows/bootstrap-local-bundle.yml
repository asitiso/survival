name: Bootstrap Local Bundle
on:
  push:
    branches:
      - work/phase4353-4370-cast-impact-readability
    paths:
      - .bootstrap-local-bundle
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create full git bundle
        run: git bundle create survival.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: survival-local-bootstrap
          path: survival.bundle
          retention-days: 1
