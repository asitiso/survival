name: Phase 4532 Tracked Build Sync

on:
  push:
    paths:
      - '.sync/phase4496.ready'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4515-4532-swift-cadence-readability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate tracked build output
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          git diff --check
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          test "$status" = ' M dist/game/enemies.js'
      - name: Commit synchronized dist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name asitiso
          git config user.email asitiso.woo@gmail.com
          git add dist/game/enemies.js
          git commit -m "build: sync swift cadence output"
          git push origin HEAD:work/phase4515-4532-swift-cadence-readability
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"
