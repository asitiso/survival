name: Phase 4875 RED

on:
  push:
    branches:
      - work/phase4875-4880-enemy-actor-depth-ordering

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Focused RED test
        run: node --test tests/phase4875-4880-enemy-actor-depth-ordering.test.mjs
