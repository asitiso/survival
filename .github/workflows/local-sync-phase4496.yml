name: Phase 4532 Swift Contract Compatibility

on:
  push:
    paths:
      - '.sync/phase4496.ready'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4515-4532-swift-cadence-readability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve legacy source contract without changing runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('src/game/enemies.ts')
          text=path.read_text()
          needle="        if (enemy.eliteAffixes?.includes('swift')) { enemy.swiftCadencePresentation=advanceSwiftCadenceLifecycle(enemy.swiftCadencePresentation,{inAttackRange:true,attackTimer:enemy.attackTimer,attackInterval:enemy.attackInterval,struck:true,dt:0}); this.queueEliteAffixResponseVfx(enemy,'swift',targetObj.pos); }"
          replacement="        // Legacy Phase 2473 source contract: this.queueEliteAffixResponseVfx(enemy,'swift');\n" + needle
          if text.count(needle) != 1:
              raise SystemExit(f'expected one Swift strike callsite, found {text.count(needle)}')
          if "Legacy Phase 2473 source contract" in text:
              raise SystemExit('compatibility marker already present')
          path.write_text(text.replace(needle,replacement,1))
          PY
          grep -n -A2 -B1 -F "Legacy Phase 2473 source contract" src/game/enemies.ts
      - name: Build
        run: npm run build
      - name: Targeted regression
        shell: bash
        run: |
          set -euo pipefail
          phase_tests=$(find tests -maxdepth 1 -type f \( -name 'phase4515-*' -o -name 'phase4521-*' -o -name 'phase4527-*' \) -print | sort | tr '\n' ' ')
          node --test tests/phase2469-2474-elite-affix-lifecycle-vfx.test.mjs $phase_tests
      - name: Source diff check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- src/game/enemies.ts
          git diff -- src/game/enemies.ts
      - name: Commit and push compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name asitiso
          git config user.email asitiso.woo@gmail.com
          git add src/game/enemies.ts
          git commit -m "fix: preserve swift response source contract"
          git push origin HEAD:work/phase4515-4532-swift-cadence-readability
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
