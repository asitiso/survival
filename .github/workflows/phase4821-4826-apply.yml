name: Phase 4821-4826 Apply

on:
  push:
    branches:
      - work/phase4821-4826-core-spatial-disambiguation
    paths:
      - .github/workflows/phase4821-4826-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase4821-4826-core-spatial-disambiguation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wire core damage origin into attribution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/game/game.ts')
          text = path.read_text()
          old = "const coreAttackAttribution=consumeCoreAttackAttribution(source);"
          new = "const coreAttackAttribution=consumeCoreAttackAttribution(source,origin);"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one game wiring match, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Build
        run: npm run build
      - name: Focused attack outcome regression
        run: node --test tests/phase4803-4808-attack-outcome-linkage.test.mjs tests/phase4809-4814-core-attack-attribution.test.mjs tests/phase4815-4820-attack-resolution-handoff.test.mjs tests/phase4821-4826-core-spatial-disambiguation.test.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit verified implementation and remove applicator
        shell: bash
        run: |
          rm .github/workflows/phase4821-4826-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/attack-outcome-linkage.ts src/game/enemy-presentation.ts src/game/core-attack-outcome-attribution.ts src/game/game.ts tests/phase4821-4826-core-spatial-disambiguation.test.mjs .github/workflows/phase4821-4826-apply.yml
          git commit -m "feat: resolve core attacks by spatial origin"
          git push origin HEAD:work/phase4821-4826-core-spatial-disambiguation
