name: Phase 4845-4850 Applicator

on:
  push:
    branches:
      - work/phase4845-4850-battlefield-depth-terrain-readability
    paths:
      - .github/workflows/phase4845-4850-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded battlefield readability patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          terrain = Path('src/game/terrain.ts')
          t = terrain.read_text()
          import_anchor = "import { battlefieldTerrainMaterial } from './battlefield-environment-assets.js';\n"
          import_line = "import type { BattlefieldDepthTerrainPresentation } from './battlefield-depth-terrain-readability.js';\n"
          assert import_anchor in t
          t = t.replace(import_anchor, import_anchor + import_line, 1)

          sig_old = "  render(ctx: CanvasRenderingContext2D, motion?: ResidualCombatMotionPolicy): void {\n    const material = battlefieldTerrainMaterial(this.currentLayout.id);\n"
          sig_new = "  render(ctx: CanvasRenderingContext2D, motion?: ResidualCombatMotionPolicy, readability?: BattlefieldDepthTerrainPresentation): void {\n    const material = battlefieldTerrainMaterial(this.currentLayout.id);\n    const obstacleReadability = readability?.obstacle ?? { contactShadowAlpha: 0.20, edgeAlpha: 0.18, shadowOffsetY: 12 };\n"
          assert sig_old in t
          t = t.replace(sig_old, sig_new, 1)

          shadow_old = "      wallShadow.addColorStop(0, 'rgba(5,9,16,.14)');\n      wallShadow.addColorStop(1, 'rgba(5,9,16,0)');\n      ctx.fillStyle = wallShadow;\n      ctx.fillRect(wall.x + 9, wall.y + 12, wall.w, wall.h + 20);\n"
          shadow_new = "      wallShadow.addColorStop(0, `rgba(5,9,16,${obstacleReadability.contactShadowAlpha.toFixed(3)})`);\n      wallShadow.addColorStop(1, 'rgba(5,9,16,0)');\n      ctx.fillStyle = wallShadow;\n      ctx.fillRect(wall.x + 9, wall.y + obstacleReadability.shadowOffsetY, wall.w, wall.h + 20);\n"
          assert shadow_old in t
          t = t.replace(shadow_old, shadow_new, 1)

          edge_old = "      ctx.strokeStyle = this.currentLayout.palette.border;\n      ctx.lineWidth = 3;\n      ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);\n      ctx.fillStyle = material.wallHighlight;\n"
          edge_new = "      ctx.strokeStyle = this.currentLayout.palette.border;\n      ctx.lineWidth = 3;\n      ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);\n      ctx.save();\n      ctx.globalAlpha = obstacleReadability.edgeAlpha;\n      ctx.strokeStyle = '#f4fbff';\n      ctx.lineWidth = 1;\n      ctx.strokeRect(wall.x + 1, wall.y + 1, Math.max(0, wall.w - 2), Math.max(0, wall.h - 2));\n      ctx.restore();\n      ctx.fillStyle = material.wallHighlight;\n"
          assert edge_old in t
          t = t.replace(edge_old, edge_new, 1)
          terrain.write_text(t)

          game = Path('src/game/game.ts')
          g = game.read_text()
          game_import_anchor = "import { BATTLEFIELD_ENVIRONMENT_ATLAS, battlefieldEnvironmentSprite } from './battlefield-environment-assets.js';\n"
          game_import = "import { battlefieldDepthTerrainPresentation, type BattlefieldDepthTerrainPresentation } from './battlefield-depth-terrain-readability.js';\n"
          assert game_import_anchor in g
          g = g.replace(game_import_anchor, game_import_anchor + game_import, 1)

          render_old = "    this.drawBattlefieldDepthOverlays(ctx);\n    this.terrain.render(ctx, residualMotion);\n    this.drawTerrainSpriteOverlays(ctx, residualMotion);\n"
          render_new = "    this.drawBattlefieldDepthOverlays(ctx);\n    const battlefieldTerrainReadability = this.drawBattlefieldTerrainReadability(ctx);\n    this.terrain.render(ctx, residualMotion, battlefieldTerrainReadability);\n    this.drawTerrainSpriteOverlays(ctx, residualMotion);\n"
          assert render_old in g
          g = g.replace(render_old, render_new, 1)

          method_anchor = "  private drawBossHealthPressure(ctx:CanvasRenderingContext2D):void {\n"
          assert method_anchor in g
          method = """  private drawBattlefieldTerrainReadability(ctx: CanvasRenderingContext2D): BattlefieldDepthTerrainPresentation {\n    const liveEnemyCount = this.enemies.enemies.reduce((count, enemy) => count + (enemy.alive ? 1 : 0), 0);\n    const battlefieldStress = Math.max(0, Math.min(1, (liveEnemyCount + this.bossArena.hazards.length * 2 - 8) / 22));\n    const readability = battlefieldDepthTerrainPresentation({\n      battlefieldStress,\n      evolutionStage: this.terrain.evolutionStage,\n      reducedMotion: this.presentationSettings.reducedMotion,\n      reducedFlash: this.presentationSettings.reducedFlash,\n    });\n    const palette = this.terrain.currentLayout.palette;\n    const arenaTop = ARENA_MARGIN + 38;\n    const arenaWidth = LOGICAL_WIDTH - ARENA_MARGIN * 2;\n    const arenaHeight = LOGICAL_HEIGHT - ARENA_MARGIN * 2 - 38;\n\n    ctx.save();\n    const groundDepth = ctx.createRadialGradient(\n      LOGICAL_WIDTH / 2, LOGICAL_HEIGHT / 2, LOGICAL_HEIGHT * 0.14,\n      LOGICAL_WIDTH / 2, LOGICAL_HEIGHT / 2, LOGICAL_WIDTH * 0.5 * readability.ground.radiusScale,\n    );\n    groundDepth.addColorStop(0, `rgba(5,9,16,${readability.ground.centerAlpha.toFixed(3)})`);\n    groundDepth.addColorStop(1, `rgba(5,9,16,${readability.ground.edgeAlpha.toFixed(3)})`);\n    ctx.fillStyle = groundDepth;\n    ctx.fillRect(ARENA_MARGIN, arenaTop, arenaWidth, arenaHeight);\n\n    const lanePulse = 1 + Math.sin(this.elapsed * 0.72) * readability.lane.pulseAmplitude;\n    ctx.globalAlpha = readability.lane.alpha * lanePulse;\n    ctx.strokeStyle = palette.border;\n    ctx.lineWidth = 1;\n    ctx.setLineDash([readability.lane.segmentLength, readability.lane.gapLength]);\n    ctx.lineDashOffset = -this.elapsed * 4 * readability.lane.pulseAmplitude;\n    const approachAnchors = [\n      { x: ARENA_MARGIN + 18, y: LOGICAL_HEIGHT * 0.32 },\n      { x: LOGICAL_WIDTH - ARENA_MARGIN - 18, y: LOGICAL_HEIGHT * 0.68 },\n      { x: LOGICAL_WIDTH * 0.34, y: arenaTop + 12 },\n      { x: LOGICAL_WIDTH * 0.66, y: LOGICAL_HEIGHT - ARENA_MARGIN - 12 },\n    ];\n    for (const anchor of approachAnchors) {\n      ctx.beginPath();\n      ctx.moveTo(anchor.x, anchor.y);\n      ctx.lineTo(this.core.pos.x, this.core.pos.y);\n      ctx.stroke();\n    }\n    ctx.setLineDash([]);\n\n    const foundation = ctx.createRadialGradient(\n      this.core.pos.x, this.core.pos.y + 8, 10,\n      this.core.pos.x, this.core.pos.y + 8, readability.core.foundationRadius,\n    );\n    foundation.addColorStop(0, 'rgba(6,11,18,.72)');\n    foundation.addColorStop(0.58, 'rgba(6,11,18,.30)');\n    foundation.addColorStop(1, 'rgba(6,11,18,0)');\n    ctx.globalAlpha = readability.core.foundationAlpha;\n    ctx.fillStyle = foundation;\n    ctx.beginPath();\n    ctx.ellipse(this.core.pos.x, this.core.pos.y + 10, readability.core.foundationRadius, readability.core.foundationRadius * 0.42, 0, 0, Math.PI * 2);\n    ctx.fill();\n\n    const corePulse = 1 + Math.sin(this.elapsed * 1.9) * readability.core.pulseAmplitude;\n    ctx.globalAlpha = readability.core.ringAlpha;\n    ctx.strokeStyle = palette.accent;\n    ctx.lineWidth = 2;\n    ctx.beginPath();\n    ctx.ellipse(this.core.pos.x, this.core.pos.y + 5, readability.core.ringRadius * corePulse, readability.core.ringRadius * 0.46 * corePulse, 0, 0, Math.PI * 2);\n    ctx.stroke();\n    ctx.restore();\n    return readability;\n  }\n\n"""
          g = g.replace(method_anchor, method + method_anchor, 1)
          game.write_text(g)
          PY
      - name: Build and focused verification
        run: |
          npm ci
          npm run build
          node --test tests/phase4845-4850-battlefield-depth-terrain-readability.test.mjs
      - name: Commit bounded source changes and remove applicator
        shell: bash
        run: |
          rm .github/workflows/phase4845-4850-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/game.ts src/game/terrain.ts .github/workflows/phase4845-4850-apply.yml
          git commit -m "feat: integrate battlefield depth and terrain readability"
          git push
